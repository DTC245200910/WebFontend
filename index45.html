<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình đơn Dropdown Ngang</title>
    <style>
        /* 1. Thiết lập font chữ chung và xóa margin/padding mặc định */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* 2. Cấu hình vùng chứa menu (#menu) */
        #menu {
            background-color: #333;
            height: 40px;
            border: 1px solid #222;
        }

        #menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* 3. Định vị cho các phần tử li và xếp menu cha theo hàng ngang */
        #menu li {
            position: relative;
            list-style: none;
        }

        #menu > ul > li {
            float: left; /* Cho các mục của menu cha nằm trên 1 hàng ngang */
        }

        /* 4. Định dạng các thẻ liên kết (a) trong menu */
        #menu a {
            display: block;
            width: 130px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            background-color: #333;
        }

        /* 5. Đổi màu nền sang MÀU ĐỎ khi rê chuột qua liên kết */
        #menu a:hover, 
        #menu li:hover > a {
            background-color: red;
        }

        /* 6. Định dạng vị trí và ẩn danh sách con (Submenu) mặc định */
        #menu ul ul {
            position: absolute;
            top: 40px; /* Xuất hiện ngay bên dưới thanh menu cha */
            left: 0;
            visibility: hidden; /* Ẩn menu con mặc định */
        }

        /* Đảm bảo các mục trong menu con xếp dọc */
        #menu ul ul li {
            float: none;
        }

        /* 7. Hiển thị menu con tương ứng khi rê chuột vào mục cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- Cấu trúc HTML của Menu Dropdown Ngang -->
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                </ul>
            </li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
