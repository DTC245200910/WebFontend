<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Hoạ Tạo Hình Với CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .outer-box {
            margin: 20px auto;
            padding: 35px;
            width: 80px;
            box-shadow: inset 0 0 22px indianred;
            border-radius: 50%;
            background-color: #ffffff;
        }

        .outer-box > .inner-box {
            padding: 0 0px 100px 0px;
            border-radius: 3%;
            box-shadow: inset 0 0 22px seagreen;
        }
    </style>
</head>
<body>

    <h2>Hiệu Ứng Khung Hình Bằng CSS</h2>

    <div class="outer-box">
        <div class="inner-box"></div>
    </div>

</body>
</html>
