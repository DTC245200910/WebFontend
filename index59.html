<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 650px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                
                <!-- Tiêu đề Form -->
                <h2 class="text-center fw-bold text-primary mb-1">Tạo Tài Khoản</h2>
                <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin bên dưới để hoàn tất đăng ký</p>

                <form action="#" method="POST">
                    
                    <!-- Họ và tên -->
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <div class="form-text text-muted">Chúng tôi cam kết không chia sẻ email của bạn với bên thứ ba.</div>
                    </div>

                    <!-- Mật khẩu & Xác nhận mật khẩu (Grid Row) -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Giới tính (Radio buttons) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Giới tính</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                            <label class="form-check-label" for="genderMale">Nam</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                            <label class="form-check-label" for="genderFemale">Nữ</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                            <label class="form-check-label" for="genderOther">Khác</label>
                        </div>
                    </div>

                    <!-- Sở thích (Checkboxes) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Sở thích</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                            <label class="form-check-label" for="hobbySports">Thể thao</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                            <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                            <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                            <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                        </div>
                    </div>

                    <!-- Quốc gia (Dropdown Select) -->
                    <div class="
