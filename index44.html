<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình đơn Dropdown Dọc</title>
    <style>
        /* 1. Đặt font chữ và xóa căn lề mặc định của trình duyệt */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
        }

        #menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* 2. Định dạng thuộc tính cho các phần tử li */
        #menu li {
            list-style: none;
            position: relative;
            width: 100px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
            border-bottom: 1px solid #333; /* Đường phân cách giữa các mục */
        }

        /* 3. Định dạng cho các thẻ liên kết (a) */
        #menu a {
            text-decoration: none;
            color: white;
            display: block;
        }

        /* 4. Đổi màu nền khi hover chuột qua thẻ li */
        #menu li:hover {
            background-color: #444;
        }

        /* 5. Định dạng danh sách con (ẩn mặc định) */
        #menu ul ul {
            position: absolute;
            top: 0;
            left: 140px; /* Tổng chiều rộng li = width(100px) + padding-left(20px) + padding-right(20px) */
            visibility: hidden;
        }

        /* 6. Hiển thị danh sách con khi rê chuột vào li chứa nó */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- Cấu trúc HTML của Menu Dropdown Dọc -->
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Phụ kiện</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
