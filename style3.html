<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Internal Style Example</title>
    <style>
        h1 {
            color: #2e7d32; /* Màu xanh lá */
        }
        p {
            color: #fb8c00; /* Màu cam */
        }
    </style>
</head>
<body>

    <h1>Tiêu Đề Trang Web (Internal Style)</h1>
    <p>Đoạn văn bản được đổi màu thông qua thẻ style trong phần head.</p>

</body>
</html>
