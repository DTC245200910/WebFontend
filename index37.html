<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành CSS Grid - grid-row-gap</title>
    <link rel="stylesheet" href="style21.css">
</head>
<body>

    <h2>Thực Hành Thuộc Tính grid-row-gap</h2>

    <h3>1. Khoảng cách giữa các hàng bằng Pixel (20px)</h3>
    <div class="grid-container gap-pixel">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>

    <h3>2. Khoảng cách giữa các hàng bằng Phần Trăm (5%)</h3>
    <div class="grid-container gap-percent">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>

</body>
</html>
