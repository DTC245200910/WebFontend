<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập thẻ liên kết</title>
</head>
<body>

    <h1>Liên kết yêu thích của tôi</h1>

    <!-- 1. Danh sách 3 liên kết trang web khác nhau -->
    <ul>
        <!-- Liên kết mở trong tab mới bằng target="_blank" -->
        <li><a href="https://www.google.com" target="_blank">Trang tìm kiếm Google (Mở tab mới)</a></li>
        <li><a href="https://github.com">Trang chủ GitHub</a></li>
        <li><a href="https://codegym.vn">Trang web học lập trình CodeGym</a></li>
    </ul>

    <!-- 2. Liên kết đến file HTML khác trong cùng thư mục -->
    <p>
        Xem thông tin cá nhân: <a href="about.html">Đến trang Giới thiệu (about.html)</a>
    </p>

    <!-- 3. Liên kết đến Email -->
    <p>
        Liên hệ với tôi: <a href="mailto:your.email@example.com">Gửi email cho tôi</a>
    </p>

</body>
</html>
