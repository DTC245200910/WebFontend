<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành thuộc tính flex-flow</title>
    <link rel="stylesheet" href="style32.css">
</head>
<body>

    <h2>Thực hành thuộc tính CSS flex-flow</h2>

    <!-- Ví dụ 1: flex-flow: row nowrap -->
    <section>
        <h3>Ví dụ 1: flex-flow: row nowrap (Mặc định: Xếp hàng ngang từ trái sang phải)</h3>
        <div class="container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

    <!-- Ví dụ 2: flex-flow: row-reverse nowrap -->
    <section>
        <h3>Ví dụ 2: flex-flow: row-reverse nowrap (Xếp hàng ngang từ phải sang trái)</h3>
        <div class="container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

</body>
</html>
