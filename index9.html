<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Người Dùng</title>
    <style>

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-card {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        .register-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1a73e8;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333333;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="tel"]:focus {
            border-color: #1a73e8;
            outline: none;
        }

        /* Tùy chọn Giới tính (Radio) */
        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        .gender-option {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #333333;
            cursor: pointer;
        }

        .gender-option input {
            margin-right: 6px;
            cursor: pointer;
        }

        /* Nút Submit */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Đăng Ký Tài Khoản</h2>
        
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">

            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="0901234567" required>
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <div class="gender-options">
                    <label class="gender-option">
                        <input type="radio" name="gender" value="Nam" checked> Nam
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="Nữ"> Nữ
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="Khác"> Khác
                    </label>
                </div>
            </div>

            <input type="submit" class="btn-submit" value="Đăng ký">

        </form>
    </div>

</body>
</html>
