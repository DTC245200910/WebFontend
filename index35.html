<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành CSS Grid - grid-template-columns</title>
    <link rel="stylesheet" href="style19.css">
</head>
<body>

    <h2>Thực Hành Thuộc Tính grid-template-columns</h2>

    <h3>Ví dụ 1: Cột cố định (px), Tự động (auto) và Tỷ lệ (1fr)</h3>
    <div class="grid-container grid-layout-1">
        <div class="grid-item">Cột 1 (150px)</div>
        <div class="grid-item">Cột 2 (auto)</div>
        <div class="grid-item">Cột 3 (1fr)</div>
    </div>

    <h3>Ví dụ 2: Sử dụng min-content và max-content</h3>
    <div class="grid-container grid-layout-2">
        <div class="grid-item">Nội dung ngắn (min-content)</div>
        <div class="grid-item">Đoạn văn dài kiểm tra max-content</div>
        <div class="grid-item">Cột còn lại (auto)</div>
    </div>

</body>
</html>
